[project]
name = "POMatch_Sagar"
version = "0.0.2"
# Do not use & or < in description or authors: `uip function pack` writes them unescaped into the .nuspec.
description = "Match PO and Check Approval"
authors = [{ name = "Sagar Agrawal", email = "sagar.agrawal@uipath.com" }]
requires-python = ">=3.11"
dependencies = [
    "uipath>=2.14.0, <2.15.0",
    "httpx>=0.28",
    "pydantic>=2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
